name: Publish versioned release
on:
  push:
    branches: [main]
    paths: [VERSION, '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine pytest pytest-asyncio httpx -e .
      - run: pytest tests -q
      - run: python -m build && twine check dist/*
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test -race ./...
        working-directory: go-validator
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o "../dist/jep-validate-${target%/*}-${target#*/}" .
          done
        working-directory: go-validator
      - name: Validate release version
        run: |
          python -c "import pathlib,re; v=pathlib.Path('VERSION').read_text().strip(); assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+)?',v)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'This version already has a release; refusing to overwrite it.'
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file RELEASE-NOTES.md dist/*
      - name: Tag the Go submodule
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/go-validator/v$(cat VERSION)" -f "sha=$GITHUB_SHA"
  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: downloaded/
      - run: mkdir dist && cp downloaded/*.whl downloaded/*.tar.gz dist/
      - name: Publish to PyPI using the configured trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
