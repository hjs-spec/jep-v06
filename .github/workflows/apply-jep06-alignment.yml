name: Apply JEP 0.6.1 alignment patch

on:
  push:
    branches:
      - fix/jep06-ietf-conformance
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/jep06-ietf-conformance' || (github.ref_name == 'fix/jep06-ietf-conformance' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jep06-ietf-conformance
          fetch-depth: 0
      - name: Expand verified alignment payload
        run: |
          unzip -o .alignment/jep06-payload.zip -d .
          rm -rf .alignment
          rm -f .github/workflows/apply-jep06-alignment.yml
      - name: Commit aligned repository state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Align JEP v0.6 implementation with IETF conformance rules'
          git push origin HEAD:fix/jep06-ietf-conformance
