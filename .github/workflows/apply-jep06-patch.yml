name: Apply JEP 0.6.1 alignment patch

on:
  push:
    branches:
      - fix/jep06-ietf-conformance
    paths:
      - '.jep06-bootstrap/**'
      - '.github/workflows/apply-jep06-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out alignment branch
        uses: actions/checkout@v4
        with:
          ref: fix/jep06-ietf-conformance
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and verify patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat .jep06-bootstrap/payload.b64.* > /tmp/jep06-payload.b64
          base64 --decode /tmp/jep06-payload.b64 > /tmp/jep06-payload.zip
          echo 'c3ea2c0f5391881c3458cb02714f05e110b7feb876aa4ef28bb9d954f683d385  /tmp/jep06-payload.zip' | sha256sum --check --strict
          rm -rf /tmp/jep06-payload
          mkdir -p /tmp/jep06-payload
          unzip -q /tmp/jep06-payload.zip -d /tmp/jep06-payload

      - name: Apply non-workflow repository payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/jep06-payload/.github/workflows/conformance.yml
          rsync -a /tmp/jep06-payload/ ./
          rm -rf .jep06-bootstrap .alignment

      - name: Commit aligned implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JEP Conformance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Align JEP v0.6 implementation with IETF conformance rules'
          git push origin HEAD:fix/jep06-ietf-conformance
