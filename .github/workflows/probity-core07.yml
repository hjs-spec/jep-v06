name: Probity Core 0.7 reader

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/probity-core07.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/probity-core07.yml']

permissions:
  contents: read

jobs:
  pinned-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the agreed JEP suite
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hjs-spec/jep-core
          ref: a87a395b54b5685fd22d6cc86d120058f1c8850d
          path: producer
          persist-credentials: false
      - name: Check out the separately maintained reader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: probityai/agent-evidence-vectors
          ref: cbd3ea8f4de89b835d6d3c4182ff4b4b1c7608f9
          path: reader
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Verify selected commits and install reader dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = a87a395b54b5685fd22d6cc86d120058f1c8850d
          test "$(git -C reader rev-parse HEAD)" = cbd3ea8f4de89b835d6d3c4182ff4b4b1c7608f9
          python -m pip install -r reader/interop/jep-core07-reader/requirements.txt
      - name: Run the separate reader against producer-owned suite bytes
        run: >-
          python reader/interop/jep-core07-reader/run.py
          --upstream producer/reference-validator/byoi_suite
          --output jep-core07-result
          --reader-revision cbd3ea8f4de89b835d6d3c4182ff4b4b1c7608f9
      - name: Retain exchanges, results and synthetic acceptance state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probity-core07-result
          path: jep-core07-result
          if-no-files-found: error
          retention-days: 90
