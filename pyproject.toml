[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jep-v06-conformance-seed"
version = "0.7.0"
description = "JEP v0.6 draft-set conformance and interoperability seed"
requires-python = ">=3.10"
dependencies = [
    "PyNaCl>=1.6.2,<2",
  "cryptography>=42",
  "rfc8785==0.1.4"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["jep_conformance"]
package-dir = {jep_conformance = "reference-validator"}

[project.scripts]
jep-validate = "jep_conformance.jep_validate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
